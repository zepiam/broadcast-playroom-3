<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Broadcast Playroom - โหมดซ่อมแซมระบบฉุกเฉิน (Emergency Self-Repair)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .card {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 32px 36px;
      width: min(92vw, 520px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
      display: inline-block;
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.85; }
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .progress-bar-wrap {
      background: #334155;
      border-radius: 999px;
      height: 8px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .progress-bar {
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }
    .status-text {
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 20px;
      min-height: 20px;
    }
    .btn {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #7dd3fc;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🛠️</div>
    <h1>ตรวจพบปัญหาไฟล์ระบบไม่สมบูรณ์</h1>
    <p>ระบบตรวจพบว่าไฟล์หน้าจอของโปรแกรมได้รับความเสียหายหรือไม่ครบถ้วน กำลังดำเนินการดาวน์โหลดไฟล์ล่าสุดเพื่อซ่อมแซมและกู้คืนตัวเองอัตโนมัติ...</p>
    
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="status-text" id="statusText">กำลังตรวจสอบเซิร์ฟเวอร์อัปเดต...</div>

    <button class="btn" id="btnAction" onclick="startEmergencyRepair()">เริ่มการซ่อมแซมทันที</button>
  </div>

  <script>
    const bar = document.getElementById('progressBar');
    const status = document.getElementById('statusText');
    const btn = document.getElementById('btnAction');

    async function startEmergencyRepair() {
      btn.disabled = true;
      btn.style.opacity = '0.5';
      status.textContent = 'กำลังติดต่อ GitHub เพื่อดึงไฟล์เวอร์ชันล่าสุด...';
      bar.style.width = '25%';

      try {
        const checkRes = await fetch('/api/check-update').then(r => r.json());
        if (checkRes && checkRes.has_update) {
          status.textContent = `พบเวอร์ชัน ${checkRes.latest_version} กำลังเริ่มดาวน์โหลดแพ็กเกจซ่อมแซม...`;
          bar.style.width = '50%';
          await fetch('/api/updater/start-download', { method: 'POST' });

          const poll = setInterval(async () => {
            try {
              const st = await fetch('/api/updater/status').then(r => r.json());
              if (st.progress != null) {
                bar.style.width = Math.max(50, st.progress) + '%';
                status.textContent = `กำลังดาวน์โหลด: ${st.progress}%`;
              }
              if (st.ready_to_apply) {
                clearInterval(poll);
                bar.style.width = '100%';
                status.textContent = 'ดาวน์โหลดเสร็จสิ้น กำลังรีสตาร์ทโปรแกรมเพื่อติดตั้ง...';
                setTimeout(() => {
                  fetch('/api/updater/apply', { method: 'POST' });
                }, 1000);
              }
            } catch (_) {}
          }, 800);
        } else {
          status.textContent = 'ไม่พบเวอร์ชันใหม่ กำลังบังคับกู้คืนไฟล์ภายในเครื่อง...';
          bar.style.width = '80%';
          setTimeout(() => location.reload(), 2000);
        }
      } catch (err) {
        status.textContent = 'เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณากดลองใหม่อีกครั้ง';
        btn.disabled = false;
        btn.style.opacity = '1';
      }
    }

    // Auto-start repair after 1.5 seconds
    setTimeout(startEmergencyRepair, 1500);
  </script>
</body>
</html>
