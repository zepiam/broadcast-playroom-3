  <script>
    (function() {
      function isolateInput(el) {
        if (!el || !el.setAttribute) return;
        el.setAttribute('autocomplete', 'off');
        el.setAttribute('autocorrect', 'off');
        el.setAttribute('autocapitalize', 'off');
        el.setAttribute('spellcheck', 'false');
        el.setAttribute('data-bwignore', 'true');
        el.setAttribute('data-lpignore', 'true');
        el.setAttribute('data-1p-ignore', 'true');
        el.setAttribute('data-form-type', 'other');
      }
      function protectAll(root = document) {
        try {
          const els = root.querySelectorAll('input, select, textarea, form');
          els.forEach(isolateInput);
        } catch (e) {}
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => protectAll());
      } else {
        protectAll();
      }
      try {
        const observer = new MutationObserver(mutations => {
          for (const m of mutations) {
            for (const node of m.addedNodes) {
              if (node.nodeType === 1) {
                if (node.matches && node.matches('input, select, textarea, form')) {
                  isolateInput(node);
                }
                if (node.querySelectorAll) {
                  protectAll(node);
                }
              }
            }
          }
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
      } catch (e) {}
    })();
  </script>

  <script>
  (function() {
    const stage = document.getElementById('obsCanvasStage');
    const notice = document.getElementById('obsStatusNotice');
    const params = new URLSearchParams(window.location.search);
    const targetPageParam = params.get('p') || params.get('page') || null;
    const legacyView = window.BP3LegacyView || 'composer';
    let canvasWidth = 1920, canvasHeight = 1080;
    const isBrowserTest = params.has('test') || window.location.protocol === 'http:';

    let lastConfigHash = '';
    const liveStates = {};
    let clockTimer = null;

    // Show temporary notice in browser test
    if (params.has('test')) {
      if (notice) {
        notice.style.display = 'block';
        setTimeout(() => { notice.style.display = 'none'; }, 4000);
      }
    }

    // Helper to get active page data
    function resolvePage(data) {
      if (!data) return null;
      let pages = Array.isArray(data) ? data : (data.pages || []);
      if (!pages.length) return null;

      if (!targetPageParam) return pages.find(p=>String(p.id)===String(data.activePageId)) || pages[0];
      const num = /^\d+$/.test(targetPageParam) ? Number(targetPageParam) : NaN;
      if (!isNaN(num) && num >= 1 && num <= pages.length) {
        return pages[num - 1];
      }
      const byId = pages.find(p => String(p.id).toLowerCase() === targetPageParam.toLowerCase() || String(p.name).toLowerCase() === targetPageParam.toLowerCase());
      if (byId) return byId;

      return pages[0];
    }

    // Render widgets onto OBS stage
    function renderWidgets(page) {
      if (!stage || !page || !Array.isArray(page.widgets)) return;

      if (legacyView !== 'composer') {
        canvasWidth = window.innerWidth; canvasHeight = window.innerHeight;
        const requestedId = params.get('id') || params.get('widget_id');
        let chosen = page.widgets.filter(w=>w.type===legacyView && (!requestedId || String(w.id)===requestedId));
        if (!chosen.length && !requestedId) chosen = [{id:'legacy-'+legacyView,type:legacyView}];
        page = {...page,widgets:chosen.map(w=>({...w,x:0,y:0,width:canvasWidth,height:canvasHeight,hidden:false}))};
      }
      stage.style.width = canvasWidth+'px';stage.style.height=canvasHeight+'px';
      document.documentElement.style.width=canvasWidth+'px';document.documentElement.style.height=canvasHeight+'px';
      document.body.style.width=canvasWidth+'px';document.body.style.height=canvasHeight+'px';
      const renderer = window.renderWidgetInnerHtml || (window.ComposerStudio && window.ComposerStudio.renderWidgetInnerHtml);
      const isFullFn = window.isFullscreenWidget || (window.ComposerStudio && window.ComposerStudio.isFullscreenWidget);

      const previous=new Map([...stage.children].filter(el=>el.dataset.id).map(el=>[el.dataset.id,el]));
      window._overlayWidgets = page.widgets;

      page.widgets.forEach(w => {
        if (w.hidden) return;

        const old=previous.get(String(w.id));previous.delete(String(w.id));
        const signature=JSON.stringify(w);
        if(old && w.type==='chat'){
          Object.assign(old.style,{left:(w.x || 0)+'px',top:(w.y || 0)+'px',width:(w.width || w.w || 300)+'px',height:(w.height || w.h || 200)+'px',zIndex:w.z || 1,opacity:w.opacity ?? 1});
          if(old._bpSignature!==signature)old.querySelector('iframe')?.contentWindow?.postMessage({type:'bp3-chat-widget',widget:w},location.origin);
          old._bpSignature=signature;return;
        }
        if(old && old._bpSignature===signature)return;
        const el = document.createElement('div');el._bpSignature=signature;
        const isFull = isFullFn ? isFullFn(w) : (
          (w.type === 'chat' && w.chatMode === 'danmaku') ||
          w.type === 'ask' ||
          w.type === 'giveaway' ||
          w.type === 'emote_party' ||
          w.type === 'randomizer' ||
          w.type === 'replie' ||
          w.isFullScreen === true
        );
        
        let classes = ['composer-widget', 'widget', 'type-' + w.type];
        if (isFull) classes.push('widget-fullscreen-fixed', 'widget-danmaku-full');
        // Theme decoration belongs to actual clock content only.
        if ((w.clockMode || (w.clockStyle && w.clockStyle !== 'none' ? 'style' : 'theme')) === 'style' && w.clockStyle && w.clockStyle !== 'none') classes.push('clock-style-set', 'clock-style-' + w.clockStyle);
        if (w.viewerTheme) classes.push('viewer-theme-' + w.viewerTheme);
        if (w.webcamTheme) classes.push('webcam-theme-' + w.webcamTheme);
        if (w.chatTheme) classes.push('theme-' + w.chatTheme);
        if (w.chatMode) classes.push('chat-mode-' + w.chatMode);

        el.className = classes.join(' ');
        el.dataset.id = w.id;
        el.dataset.type = w.type;

        el.style.left = (isFull ? 0 : (w.x || 0)) + 'px';
        el.style.top = (isFull ? 0 : (w.y || 0)) + 'px';
        el.style.width = (isFull ? canvasWidth : (w.width || w.w || 300)) + 'px';
        el.style.height = (isFull ? canvasHeight : (w.height || w.h || 200)) + 'px';
        el.style.zIndex = w.z || 1;
        el.style.opacity = w.opacity ?? 1;

        if(w.type==='chat'){
          const frame=document.createElement('iframe');frame.dataset.legacyChat='true';frame.id='legacyChat_'+w.id;frame.src='/legacy-chat.html?id='+encodeURIComponent(w.id)+'&p='+encodeURIComponent(page.id);frame.style.cssText='border:0;width:100%;height:100%;background:transparent';el.append(frame);stage.append(el);return;
        }
        if (typeof renderer === 'function') {
          el.innerHTML = renderer(w);
        } else {
          el.innerHTML = `<div class="composer-widget-inner">${w.title || w.type}</div>`;
        }

        if(old){window.BP3PatchWidget(old,el);old._bpSignature=signature;}else stage.appendChild(el);
      });

      for(const el of previous.values())el.remove();
      window.BP3LegacyVideos?.mount();
      if(window.BP3LegacyImages)window.BP3LegacyImages.mount();
      window.BP3LegacyText?.mount();
      window.BP3LegacyAvatar?.mount();
      window.BP3LegacyGoals?.mount();
      if (window.BP3Live) window.BP3Live.restore();
      if (liveStates.ASK_UPDATE) handleAskUpdate(liveStates.ASK_UPDATE);
      if (liveStates.GIVEAWAY_UPDATE) handleGwUpdate(liveStates.GIVEAWAY_UPDATE);
      startClockTicker();
    }

    // Live Clock Ticker
    function startClockTicker() {
      if (clockTimer) return;
      clockTimer = setInterval(() => {
        const now=new Date();
        document.querySelectorAll('.composer-widget.type-clock').forEach(el=>{
          const widget=(window._overlayWidgets || []).find(w=>String(w.id)===el.dataset.id);
          window.BP3UpdateClock?.(el,widget,now);
        });
      },1000);
    }

    // Fetch layout from Server or fallback to localStorage
    async function updateLayout() {
      let data = null;

      // 1. Try server API /api/composer/layout
      try {
        const res = await fetch('/api/composer/layout?t=' + Date.now(), { cache: 'no-store' });
        if (res.ok) {
          data = await res.json();
        }
      } catch (e) {
        // Server offline
      }

      // 2. Fallback to localStorage
      if (!data) {
        try {
          const local = localStorage.getItem('bp_composer_studio_v3_full') || localStorage.getItem('bp_composer_studio_v3');
          if (local) data = JSON.parse(local);
        } catch (e) {}
      }

      if (data) {
        canvasWidth=Number(data.canvasWidth || data.canvas_w) || 1920;canvasHeight=Number(data.canvasHeight || data.canvas_h) || 1080;
        const page = resolvePage(data);
        const hash = JSON.stringify([page,canvasWidth,canvasHeight]);
        if (hash !== lastConfigHash) {
          lastConfigHash = hash;
          renderWidgets(page);
        }
      }
    }

    // Initial load
    updateLayout();

    // Fast Polling (700ms hash diff)
    setInterval(updateLayout, 700);

        let _randomizerTimer = null;
    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function handleRandomizerSpin(data) {
      if (!data) return;

      // 2. On-Demand Dynamic Modal Overlay (Matches Old Version Dev exactly)
      const existing = document.getElementById('on-demand-randomizer-overlay');
      if (existing) {
        existing.remove();
      }
      if (_randomizerTimer) {
        clearTimeout(_randomizerTimer);
        _randomizerTimer = null;
      }

      const items = (data.items && data.items.length) ? data.items : ['ตัวเลือก 1', 'ตัวเลือก 2'];
      const winner = data.winner || items[0];
      const title = data.title || '🎰 สุ่มกิจกรรม';
      const st = data.settings || {};
      const scale = (st.scale || 100) / 100;
      const ox = parseInt(st.offset_x, 10) || 0;
      const oy = parseInt(st.offset_y, 10) || 0;
      const anchor = st.anchor || 'center';
      const holdDuration = (st.duration !== undefined ? parseFloat(st.duration) : (data.duration || 5)) * 1000;

      let anchorStyle = '';
      let transOrigin = 'center center';
      let baseTrans = '';

      if (anchor === 'top-left') {
        anchorStyle = 'top: 40px; left: 40px;';
        transOrigin = 'top left';
        baseTrans = 'translate(0px, 0px)';
      } else if (anchor === 'top-center') {
        anchorStyle = 'top: 40px; left: 50%;';
        transOrigin = 'top center';
        baseTrans = 'translate(-50%, 0px)';
      } else if (anchor === 'top-right') {
        anchorStyle = 'top: 40px; right: 40px;';
        transOrigin = 'top right';
        baseTrans = 'translate(0px, 0px)';
      } else if (anchor === 'middle-left') {
        anchorStyle = 'top: 50%; left: 40px;';
        transOrigin = 'left center';
        baseTrans = 'translate(0px, -50%)';
      } else if (anchor === 'center') {
        anchorStyle = 'top: 50%; left: 50%;';
        transOrigin = 'center center';
        baseTrans = 'translate(-50%, -50%)';
      } else if (anchor === 'middle-right') {
        anchorStyle = 'top: 50%; right: 40px;';
        transOrigin = 'right center';
        baseTrans = 'translate(0px, -50%)';
      } else if (anchor === 'bottom-left') {
        anchorStyle = 'bottom: 40px; left: 40px;';
        transOrigin = 'bottom left';
        baseTrans = 'translate(0px, 0px)';
      } else if (anchor === 'bottom-center') {
        anchorStyle = 'bottom: 40px; left: 50%;';
        transOrigin = 'bottom center';
        baseTrans = 'translate(-50%, 0px)';
      } else if (anchor === 'bottom-right') {
        anchorStyle = 'bottom: 40px; right: 40px;';
        transOrigin = 'bottom right';
        baseTrans = 'translate(0px, 0px)';
      }

      const overlay = document.createElement('div');
      overlay.id = 'on-demand-randomizer-overlay';
      overlay.style.cssText = `
        position: fixed;
        ${anchorStyle}
        z-index: 9999999;
        pointer-events: none;
        transform: ${baseTrans} translate(${ox}px, ${oy}px) scale(${scale});
        transform-origin: ${transOrigin};
        transition: opacity 0.4s ease-out, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        opacity: 0;
        contain: layout style paint;
        isolation: isolate;
      `;

      overlay.innerHTML = `
        <div style="
          width: 460px;
          background: rgba(11, 17, 32, 0.96);
          border: 2px solid #3b82f6;
          border-radius: 18px;
          box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85), 0 0 25px rgba(59, 130, 246, 0.25);
          padding: 24px 26px 20px 26px;
          font-family: -apple-system, BlinkMacSystemFont, 'Prompt', 'Kanit', 'Noto Sans Thai', sans-serif;
          box-sizing: border-box;
          color: #ffffff;
          text-align: center;
          contain: layout style paint;
        ">
          <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 14px;">
            <span style="font-size: 20px;">🎰</span>
            <span style="font-size: 15px; font-weight: 800; color: #38bdf8; letter-spacing: 0.5px; text-transform: uppercase;">
              ${escapeHtml(title)}
            </span>
          </div>

          <div id="randomizer-roller-box" style="
            background: rgba(2, 6, 23, 0.95);
            border: 2px solid #1e293b;
            border-radius: 12px;
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 16px;
            box-sizing: border-box;
            overflow: hidden;
            transition: border-color 0.3s, background-color 0.3s;
          ">
            <span id="randomizer-roller-text" style="
              font-size: 24px;
              font-weight: 800;
              color: #f1f5f9;
              white-space: nowrap;
              overflow: hidden;
              text-overflow: ellipsis;
              max-width: 100%;
            ">...</span>
          </div>

          <div id="randomizer-footer-pill" style="
            margin-top: 14px;
            font-size: 12.5px;
            font-weight: 600;
            color: #94a3b8;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
          ">
            <span>⚡ กำลังสุ่ม...</span>
          </div>
        </div>
      `;

      document.body.appendChild(overlay);

      requestAnimationFrame(() => {
        overlay.style.opacity = '1';
      });

      const palette = {pastel:['#c4b5fd','#f9a8d4'], neon:['#d946ef','#22d3ee'], gold:['#f59e0b','#fbbf24'], mint:['#10b981','#6ee7b7']}[st.color_theme] || ['#c4b5fd','#f9a8d4'];
      overlay.firstElementChild.style.borderColor = palette[0];
      overlay.firstElementChild.querySelector('div span:nth-child(2)').style.color = palette[1];
      const rollerText = overlay.querySelector('#randomizer-roller-text');
      const rollerBox = overlay.querySelector('#randomizer-roller-box');
      const footerPill = overlay.querySelector('#randomizer-footer-pill');
      const randomVisual = window.BP3RandomizerVisual?.mount(overlay.firstElementChild, data, Math.max(2, Math.min(7, Number(st.spin_duration) || 4)));

      let ticks = 0;
      const maxTicks = 26;
      const delay = Math.max(2, Math.min(7, Number(st.spin_duration) || 4)) * 1000 / maxTicks;

      function runTick() {
        if (!overlay.isConnected) return;
        ticks++;
        const cand = items[Math.floor(Math.random() * items.length)];
        if (rollerText) rollerText.textContent = cand;

        if (ticks < maxTicks) {
          setTimeout(runTick, delay);
        } else {
          if (rollerText) rollerText.textContent = winner;
          randomVisual?.finish();
          if (rollerBox) {
            rollerBox.style.borderColor = '#f59e0b';
            rollerBox.style.backgroundColor = 'rgba(245, 158, 11, 0.12)';
            rollerText.style.color = '#fbbf24';
          }
          if (footerPill) {
            footerPill.innerHTML = '<span style="color: #fbbf24; font-weight: 700;">🎉 ผลการสุ่มเรียบร้อยแล้ว</span>';
          }

          _randomizerTimer = setTimeout(() => {
            overlay.style.opacity = '0';
            overlay.style.transform = `${baseTrans} translate(${ox}px, ${oy - 20}px) scale(${scale * 0.95})`;
            setTimeout(() => {
              overlay.remove();
            }, 400);
          }, holdDuration);
        }
      }

      runTick();
    }

    function handleAskUpdate(data) {
      if (window.BP3LegacyAsk) {window.BP3LegacyAsk.render(data);return;}
      document.querySelectorAll('.widget.type-ask').forEach(widgetEl => {
        const wid = widgetEl.dataset.id;
        const panel = document.getElementById(`compAskPanel_${wid}`);
        const isAskActive = data && data.active === true && (data.phase === 'voting' || data.phase === 'paused' || data.phase === 'ended');
        if (panel) {
          panel.style.display = isAskActive ? 'block' : 'none';
        }
        if (isAskActive) {
          const qEl = document.getElementById(`compAskQ_${wid}`);
          if (qEl) qEl.textContent = data.phase === 'ended' ? `🏆 สรุปผล: ${data.question}` : `📊 ${data.question}`;
          const timerEl = document.getElementById(`compAskTimer_${wid}`);
          if (timerEl) {
            timerEl.textContent = data.phase === 'ended' ? '🏆 สรุปผล' : data.phase === 'paused' ? '⏸ พักโหวต' : (data.remainingSec != null ? `⏱ ${data.remainingSec}s` : '🗳️ โหวตสด');
          }
          const listEl = document.getElementById(`compAskChoicesList_${wid}`);
          if (listEl && data.choices) {
            const choices = data.phase === 'ended' ? [...data.choices].sort((a,b)=>(b.votes||0)-(a.votes||0)) : data.choices;
            listEl.innerHTML = choices.map((c,index) => `
              <div style="background:${data.phase==='ended' && index===0 && c.votes>0 ? 'rgba(251,191,36,.18)' : 'rgba(255,255,255,.05)'}; border-radius:6px; padding:6px 10px; position:relative; overflow:hidden;">
                <div style="position:absolute; inset:0; width:${data.phase==='ended' || data.realtime!==false ? c.pct : 0}%; background:${c.color || '#38bdf8'}; opacity:0.25; border-radius:6px;"></div>
                <div style="position:relative; z-index:1; display:flex; justify-content:space-between; font-size:12px; font-weight:600; color:#ffffff;">
                  <span>${data.phase==='ended' && index===0 && c.votes>0 ? '👑 ' : ''}${escapeHtml(c.label)}: ${escapeHtml(c.text)}</span>
                  <span style="color:${c.color || '#38bdf8'}; font-weight:700;">${data.phase==='ended' || data.realtime!==false ? `${c.pct}% (${c.votes || 0})` : ''}</span>
                </div>
              </div>
            `).join('');
          }
        }
      });
    }

    function handleGwUpdate(data) {
      if (window.BP3LegacyGiveaway) {window.BP3LegacyGiveaway.render(data);return;}
      document.querySelectorAll('.widget.type-giveaway').forEach(widgetEl => {
        const wid = widgetEl.dataset.id;
        const panel = document.getElementById(`compGwPanel_${wid}`);
        const isGwActive = data && data.active === true && (data.phase === 'running' || data.phase === 'winner');
        if (panel) {
          panel.style.display = isGwActive ? 'block' : 'none';
        }
        if (isGwActive) {
          const pEl = document.getElementById(`compGwPrize_${wid}`);
          if (pEl) pEl.textContent = data.prize;
          const hEl = document.getElementById(`compGwHint_${wid}`);
          if (hEl) hEl.innerHTML = `พิมพ์ <strong style="color:#fb7185;">${data.code}</strong> ในแชทเพื่อเข้าร่วมสุ่ม`;
          const cEl = document.getElementById(`compGwCount_${wid}`);
          if (cEl) cEl.textContent = `ผู้เข้าร่วม: ${data.count} คน`;
          const winEl = document.getElementById(`compGwWinner_${wid}`);
          const winNameEl = document.getElementById(`compGwWinnerName_${wid}`);
          if (winEl && winNameEl) {
            if (data.winner) {
              winNameEl.textContent = data.winner;
              winEl.style.display = 'block';
            } else {
              winEl.style.display = 'none';
            }
          }
        }
      });
    }

    function handlePlayroomAction(data) {
      document.querySelectorAll('.widget.type-playroom').forEach(widgetEl => {
        const wid = widgetEl.dataset.id;
        const stage = document.getElementById(`compPlayroomStage_${wid}`);
        const idle = document.getElementById(`compPlayroomIdle_${wid}`);
        const title = document.getElementById(`compPlayroomTitle_${wid}`);
        const tag = document.getElementById(`compPlayroomTag_${wid}`);
        const bar = document.getElementById(`compPlayroomBar_${wid}`);
        if (idle) idle.style.display = 'none';
        if (stage && title && tag && bar) {
          title.textContent = data.name;
          tag.textContent = `คำสั่ง ${data.trigger}`;
          stage.style.display = 'flex';
          bar.style.transition = 'none';
          bar.style.width = '100%';
          setTimeout(() => {
            bar.style.transition = `width ${data.duration || 5}s linear`;
            bar.style.width = '0%';
          }, 50);

          setTimeout(() => {
            stage.style.display = 'none';
            if (idle) idle.style.display = 'none';
          }, (data.duration || 5) * 1000);
        }
      });
    }

    function receiveLiveEvent(item) {
      const {event,payload} = item || {};
      const allowed={chat:['CHAT_MESSAGE','CHAT_CLEAR'],giveaway:['GIVEAWAY_UPDATE'],playroom:['PLAYROOM_PLAY_CLIP'],viewer:['VIEWERS_UPDATE']};
      if (legacyView!=='composer' && event!=='CANVAS_LAYOUT_SAVED' && !(allowed[legacyView] || []).includes(event)) return;
      if (event === 'CANVAS_LAYOUT_SAVED') updateLayout();
      else if (event === 'RANDOMIZER_SPIN') handleRandomizerSpin(payload);
      else if (event === 'ASK_UPDATE') {
        if (payload?.demo && liveStates.ASK_UPDATE?.active) return;
        if (!payload?.demo) {liveStates.ASK_UPDATE = payload; window._liveAskState = payload;}
        handleAskUpdate(payload);
      } else if (event === 'GIVEAWAY_UPDATE') {
        if (payload?.demo && liveStates.GIVEAWAY_UPDATE?.active) return;
        if (!payload?.demo) {liveStates.GIVEAWAY_UPDATE = payload; window._liveGwState = payload;}
        handleGwUpdate(payload);
      }
      if (window.BP3Live) window.BP3Live.receive(item);
    }
    window.addEventListener('bp3:remote-event', e => receiveLiveEvent(e.detail));
    if (!window.BP3Transport && 'BroadcastChannel' in window) {
      const bus = new BroadcastChannel('bp3_system_channel');
      bus.onmessage = e => receiveLiveEvent(e.data);
    }

  })();
  </script>
</body>
</html>
