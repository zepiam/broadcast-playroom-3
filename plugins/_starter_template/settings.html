<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Plugin Settings</title>
  <style>
    body {
      background-color: #232428;
      color: #f2f3f5;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 16px;
      margin: 0;
    }
    .card {
      background: #1e1f22;
      border: 1px solid #35363c;
      border-radius: 8px;
      padding: 16px;
      max-width: 500px;
    }
    h3 { margin-top: 0; color: #38bdf8; }
    p { color: #949ba4; font-size: 14px; }
    .btn {
      background: #5865f2;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn:hover { background: #4752c4; }
  </style>
</head>
<body>
  <div class="card">
    <h3>🧩 ปลั๊กอินตัวอย่างเริ่มต้น</h3>
    <p>นี่คือหน้าต่างการตั้งค่าตัวอย่างของปลั๊กอิน คุณสามารถออกแบบหน้าตานี้ได้อย่างอิสระ</p>
    <button class="btn" onclick="alert('ทดสอบการกดปุ่มสำเร็จ!')">คลิกทดสอบ</button>
  </div>
</body>
</html>
